name: Publish container image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to the branch name)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: ./gradlew jib --image="ghcr.io/${{ github.repository }}:${TAG:-$GITHUB_REF_NAME}"
        env:
          TAG: ${{ inputs.tag }}

      - name: Report published image
        run: echo "Published ghcr.io/${{ github.repository }}:${TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ inputs.tag }}
